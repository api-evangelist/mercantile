aid: mercantile
name: Mercantile
description: Mercantile is a branded business credit card platform operated by Onboard Partners
  LLC (Boston, MA) that helps fintechs, consumer brands, and trade associations launch and run
  custom affinity credit card programs. It delivers a turnkey card-as-a-service stack — card issuing
  (cards issued by Hatch Bank on the Mastercard network), tailored underwriting and flexible funding,
  a ready-made regulatory/compliance/banking framework, real-time fraud monitoring, rewards, cardholder
  support, and full-service marketing — plus a partner API that lets brands integrate card features
  into their own systems to automate and scale their program.
